<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - La Mây Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-register {
            width: 100%;
            max-width: 550px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="card card-register bg-white p-4 mx-3">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-warning"><i class="fa-solid fa-hotel me-2 text-dark"></i>LA MÂY BOUTIQUE</h3>
            <p class="text-muted">Đăng ký tài khoản thành viên để đặt phòng nhanh chóng</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/dang-ky" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Tên Đăng Nhập</label>
                    <input type="text" class="form-control" name="tenDangNhap" placeholder="VD: nguyenvantan" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="VD: email@gmail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mật Khẩu</label>
                <input type="password" class="form-control" name="matKhau" placeholder="********" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Họ và Tên</label>
                <input type="text" class="form-control" name="hoTen" placeholder="VD: Nguyễn Văn Lễ Tân" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Số Điện Thoại</label>
                    <input type="text" class="form-control" name="sdt" placeholder="VD: 0901234567">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Số CCCD</label>
                    <input type="text" class="form-control" name="cccd" placeholder="VD: 079123456789">
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mt-3 text-white" style="letter-spacing: 1px;">Đăng Ký Ngay</button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang chủ</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
