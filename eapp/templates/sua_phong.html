<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Phòng Thực Tế - Luxury Hotel</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f5f0; font-family: 'Jost', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-serif { font-family: 'Playfair Display', serif !important; }
        .sidebar { min-height: 100vh; background-color: #1a1a1a; color: white; border-right: 2px solid #D4AF37; }
        .sidebar a { color: #ccc; text-decoration: none; padding: 15px 20px; display: block; transition: 0.3s; font-size: 0.95rem; letter-spacing: 1px; }
        .sidebar a:hover, .sidebar a.active { background-color: #2a2a2a; color: #D4AF37; border-left: 4px solid #D4AF37; }
        .stat-card { border-radius: 0; border-top: 3px solid #D4AF37; color: #333; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); background: #fff; }
        .bg-brown { background-color: #1a1a1a !important; color: white !important; }
        .text-gold { color: #D4AF37 !important; }
        .btn-warning { background-color: #D4AF37 !important; border-color: #D4AF37 !important; color: white !important; border-radius: 0; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }
        .btn-warning:hover { background-color: #B5952F !important; border-color: #B5952F !important; color: white !important; }
        
        .card { border-radius: 0; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .card-header { border-radius: 0 !important; background-color: #1a1a1a !important; color: #D4AF37 !important; font-family: 'Playfair Display', serif; letter-spacing: 1px; border-bottom: 2px solid #D4AF37; }
        
        .table { font-size: 0.95rem; }
        .table thead th { background-color: #1a1a1a !important; color: #D4AF37 !important; font-family: 'Playfair Display', serif; font-weight: normal; letter-spacing: 1px; }
        
        .btn-primary, .btn-success, .btn-info { background-color: #1a1a1a !important; border-color: #1a1a1a !important; color: #D4AF37 !important; border-radius: 0; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .btn-primary:hover, .btn-success:hover, .btn-info:hover { background-color: #D4AF37 !important; border-color: #D4AF37 !important; color: white !important; }
        .btn-danger { border-radius: 0; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
</style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar" style="width: 250px;">
            <div class="text-center py-4 border-bottom border-secondary">
                <h4 class="font-serif fw-bold text-gold mb-0" style="letter-spacing: 3px;"><i class="fa-solid fa-hotel me-2"></i>LUXURY</h4>
            </div>
            <div class="p-3 border-bottom border-secondary d-flex align-items-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="rounded-circle me-2" width="40">
                <div>
                    <div class="fw-bold">{{ nhan_vien.hoTen }}</div>
                    <small class="text-success"><i class="fa-solid fa-circle text-success" style="font-size: 8px;"></i> Online</small>
                </div>
            </div>
            <nav class="mt-3">
                <a href="/quan-tri"><i class="fa-solid fa-gauge-high me-2"></i> Tổng Quan</a>
                <a href="/quan-ly-phong"><i class="fa-solid fa-layer-group me-2"></i> Loại Phòng</a>
                <a href="/danh-sach-phong" class="active"><i class="fa-solid fa-bed me-2"></i> Danh Sách Phòng</a>
                <a href="#"><i class="fa-solid fa-bell-concierge me-2"></i> Quản Lý Dịch Vụ</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1">
            <nav class="navbar navbar-expand bg-white shadow-sm px-4 py-3 mb-4">
                <h5 class="mb-0 fw-bold">Chỉnh Sửa Phòng: <span class="text-gold">{{ phong.maPhong }}</span></h5>
            </nav>

            <div class="container-fluid px-4">
                <div class="card shadow-sm border-0 w-75">
                    <div class="card-header bg-warning text-dark fw-bold py-3">
                        <i class="fa-solid fa-pen-to-square me-2"></i>Cập Nhật Dữ Liệu Phòng
                    </div>
                    <div class="card-body p-4">
                        <form action="/danh-sach-phong/sua/{{ phong.maPhong }}" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Số Phòng hiển thị</label>
                                    <input type="text" class="form-control" name="soPhong" value="{{ phong.soPhong }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Tầng</label>
                                    <input type="number" class="form-control" name="tang" value="{{ phong.tang }}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Thuộc Loại Phòng</label>
                                <select class="form-select" name="maLoaiPhong" required>
                                    {% for loai in danh_sach_loai %}
                                        <option value="{{ loai.maLoaiPhong }}" {% if loai.maLoaiPhong == phong.maLoaiPhong %}selected{% endif %}>
                                            {{ loai.tenLoaiPhong }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Trạng Thái</label>
                                <select class="form-select" name="trangThai">
                                    <option value="Trống" {% if phong.trangThai == 'Trống' %}selected{% endif %}>Trống</option>
                                    <option value="Đang thuê" {% if phong.trangThai == 'Đang thuê' %}selected{% endif %}>Đang thuê</option>
                                    <option value="Cần dọn" {% if phong.trangThai == 'Cần dọn' %}selected{% endif %}>Cần dọn</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Ghi Chú</label>
                                <input type="text" class="form-control" name="ghiChu" value="{{ phong.ghiChu or '' }}">
                            </div>

                            <div>
                                <a href="/danh-sach-phong" class="btn btn-secondary me-2">Quay Lại</a>
                                <button type="submit" class="btn btn-success fw-bold">Cập Nhật</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
